# Weekly updates for the app's packages, the GitHub Actions above, and the
# Docker base images. Minor and patch updates come as one pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # The images compose.yml runs: Postgres, Inngest and Redis.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
